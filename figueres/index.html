<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>TaxiCount · Associació de Taxis Figueres / Vilafant</title>
<meta name="description" content="Gratis fins al 31 de desembre per a l'Associació de Taxis Figueres / Vilafant. De taxistes, per a taxistes.">
<meta property="og:title" content="TaxiCount · Gratis fins al 31 de desembre">
<meta property="og:description" content="Només per a l'Associació de Taxis Figueres / Vilafant. De taxistes, per a taxistes.">
<meta property="og:image" content="https://www.taxicount.com/figueres/og.jpg">
<meta property="og:url" content="https://www.taxicount.com/figueres/">
<meta name="theme-color" content="#FFC107">
<link rel="icon" href="../assets/brand/isotip.png">
<!-- Presentació per a l'Associació de Taxis Figueres / Vilafant en format «stories».
     Les imatges són les mateixes escenes que el vídeo (registro/presentacion/generador/video.mjs). -->
<style>
  :root { --amber: #FFC107; --ink: #1F1B16; --muted: #5F5A52; --bg: #FFFFFF; --side: #F3EFE8; }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--side); color: var(--ink); font-family: Arial, Helvetica, sans-serif; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  .stage { position: relative; height: 100dvh; width: min(100vw, calc(100dvh * 9 / 16)); background: var(--bg); overflow: hidden; user-select: none; touch-action: manipulation; }
  @media (min-width: 700px) { .stage { height: min(100dvh, 940px); width: calc(min(100dvh, 940px) * 9 / 16); border-radius: 22px; box-shadow: 0 20px 60px rgba(31,27,22,.18); } }
  .frame { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .box { position: relative; width: 100%; aspect-ratio: 9 / 16; max-height: 100%; }
  .box img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }
  .bars { position: absolute; top: max(10px, env(safe-area-inset-top)); left: 10px; right: 10px; display: flex; gap: 4px; z-index: 5; }
  .bar { flex: 1; height: 4px; border-radius: 2px; background: rgba(31,27,22,.15); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--ink); }
  .top { position: absolute; top: calc(max(10px, env(safe-area-inset-top)) + 14px); right: 10px; z-index: 6; display: flex; gap: 6px; }
  .lang { border: 1.5px solid var(--ink); background: rgba(255,255,255,.9); color: var(--ink); font: 700 13px Arial; border-radius: 16px; padding: 5px 10px; cursor: pointer; }
  .lang[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .hit { position: absolute; z-index: 3; cursor: pointer; border: 0; background: transparent; }
  .play { position: absolute; z-index: 4; left: 5.9%; right: 5.9%; bottom: 7.8%; height: 6.25%; border-radius: 999px; display: none; cursor: pointer; }
  .play:focus-visible, .lang:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
  .hint { position: absolute; bottom: max(14px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; font-size: 13px; color: var(--muted); z-index: 5; transition: opacity .6s; pointer-events: none; }
  .again { position: absolute; z-index: 4; left: 50%; transform: translateX(-50%); bottom: 14%; display: none; border: 0; border-radius: 999px; background: var(--ink); color: #fff; font: 700 16px Arial; padding: 12px 22px; cursor: pointer; }
  @media (prefers-reduced-motion: reduce) { .bar i { transition: none !important; } }
</style>
</head>
<body>
<main class="stage" id="stage" aria-roledescription="presentació">
  <div class="bars" id="bars"></div>
  <div class="top">
    <button class="lang" data-l="ca" aria-pressed="true">CA</button>
    <button class="lang" data-l="es" aria-pressed="false">ES</button>
  </div>
  <div class="frame"><div class="box" id="box">
    <img id="img" alt="">
    <a class="play" id="play" href="https://play.google.com/store/apps/details?id=app.taxicount" target="_blank" rel="noopener" aria-label="Google Play"></a>
  </div></div>
  <button class="hit" id="prev" style="left:0;top:0;bottom:0;width:30%" aria-label="Anterior"></button>
  <button class="hit" id="next" style="right:0;top:0;bottom:0;width:70%" aria-label="Següent"></button>
  <button class="again" id="again"></button>
  <div class="hint" id="hint"></div>
</main>
<script>
(() => {
  // [fitxer, segons, text alternatiu]  — mateix ordre que el vídeo
  const N = 11, OFFER = 10, DUR = [4, 5, 7, 7, 7, 7, 7, 7, 7, 11, 6];
  const TXT = {
    ca: { hint: 'Toca per avançar · llisca per tornar', again: 'Torna a començar', prev: 'Anterior', next: 'Següent',
      alt: ['TaxiCount. De taxistes, per a taxistes.', 'El teu taxi, sense papers.', 'Apunta la cursa parlant.', 'Totes les curses i despeses, al dia.', 'La jornada, registrada segons la llei.', 'Tota la flota en una pantalla.', 'Cotxes i conductors, sota control: km, ITV i assegurança.', "Agenda de serveis amb notificació d'avís.", "L'informe, ja fet: Excel i PDF.", "Gratis fins al 31 de desembre, només per a l'Associació de Taxis Figueres / Vilafant. Després, cupó TAXICOUNT50: 15 € el primer any per conductor.", 'TaxiCount. www.taxicount.com'] },
    es: { hint: 'Toca para avanzar · desliza para volver', again: 'Volver a empezar', prev: 'Anterior', next: 'Siguiente',
      alt: ['TaxiCount. De taxistas, para taxistas.', 'Tu taxi, sin papeles.', 'Apunta la carrera hablando.', 'Todas tus carreras y gastos, al día.', 'La jornada, registrada como pide la ley.', 'Toda tu flota en una pantalla.', 'Coches y conductores, bajo control: km, ITV y seguro.', 'Agenda de servicios con notificación de aviso.', 'El informe, ya hecho: Excel y PDF.', 'Gratis hasta el 31 de diciembre, solo para la Asociación de Taxis Figueres / Vilafant. Después, cupón TAXICOUNT50: 15 € el primer año por conductor.', 'TaxiCount. www.taxicount.com'] },
  };
  let lang = 'ca';
  try {
    const q = new URLSearchParams(location.search).get('lang');
    lang = q === 'es' || q === 'ca' ? q : (localStorage.getItem('tc_lang') || ((navigator.language || '').toLowerCase().startsWith('es') ? 'es' : 'ca'));
  } catch (e) { /* sense emmagatzematge: català */ }
  if (lang !== 'es') lang = 'ca';

  const $ = (id) => document.getElementById(id);
  const img = $('img'), bars = $('bars'), play = $('play'), again = $('again'), hint = $('hint');
  for (let i = 0; i < N; i++) bars.insertAdjacentHTML('beforeend', '<div class="bar"><i></i></div>');
  const fills = [...bars.querySelectorAll('i')];
  const src = (i) => `img/${lang}/${String(i + 1).padStart(2, '0')}.webp`;
  const cache = {};
  const preload = () => { for (let i = 0; i < N; i++) { const k = src(i); if (!cache[k]) { cache[k] = new Image(); cache[k].src = k; } } };

  let cur = 0, start = 0, elapsed = 0, paused = false, raf = 0;
  function show(i) {
    cur = Math.max(0, Math.min(N - 1, i));
    img.src = src(cur);
    img.alt = TXT[lang].alt[cur];
    play.style.display = cur === OFFER - 1 ? 'block' : 'none';
    again.style.display = cur === N - 1 ? 'block' : 'none';
    fills.forEach((f, k) => { f.style.width = k < cur ? '100%' : '0'; });
    elapsed = 0; start = performance.now();
  }
  function tick(now) {
    if (!paused) {
      const t = elapsed + (now - start);
      const d = DUR[cur] * 1000;
      fills[cur].style.width = Math.min(100, (t / d) * 100) + '%';
      if (t >= d && cur < N - 1) show(cur + 1);
    }
    raf = requestAnimationFrame(tick);
  }
  function pause() { if (!paused) { elapsed += performance.now() - start; paused = true; } }
  function resume() { if (paused) { start = performance.now(); paused = false; } }
  function setLang(l) {
    lang = l;
    try { localStorage.setItem('tc_lang', l); } catch (e) {}
    document.documentElement.lang = l;
    document.querySelectorAll('.lang').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.l === l)));
    hint.textContent = TXT[l].hint; again.textContent = TXT[l].again;
    $('prev').setAttribute('aria-label', TXT[l].prev); $('next').setAttribute('aria-label', TXT[l].next);
    preload(); img.src = src(cur); img.alt = TXT[l].alt[cur];
  }

  let skip = false; // un lliscament o una pausa llarga no compten com a toc
  $('next').addEventListener('click', () => { if (skip) { skip = false; return; } show(cur + 1); });
  $('prev').addEventListener('click', () => { if (skip) { skip = false; return; } show(cur - 1); });
  again.addEventListener('click', () => show(0));
  document.querySelectorAll('.lang').forEach((b) => b.addEventListener('click', (e) => { e.stopPropagation(); setLang(b.dataset.l); }));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); show(cur + 1); }
    if (e.key === 'ArrowLeft') show(cur - 1);
  });
  // Mantenir premut = pausa; lliscar = canviar de pantalla
  let x0 = null, t0 = 0;
  const stage = $('stage');
  stage.addEventListener('pointerdown', (e) => { x0 = e.clientX; t0 = performance.now(); pause(); });
  stage.addEventListener('pointerup', (e) => {
    const dx = x0 == null ? 0 : e.clientX - x0; x0 = null; resume();
    if (Math.abs(dx) > 50) { skip = true; show(cur + (dx < 0 ? 1 : -1)); }
    else if (performance.now() - t0 > 350) skip = true;
    setTimeout(() => { skip = false; }, 400);
  });
  stage.addEventListener('pointercancel', () => { x0 = null; resume(); });
  document.addEventListener('visibilitychange', () => (document.hidden ? pause() : resume()));
  setTimeout(() => { hint.style.opacity = '0'; }, 5000);

  setLang(lang); show(0); raf = requestAnimationFrame(tick);
})();
</script>
</body>
</html>
