<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TaxiCount · Tutorials</title>
<meta name="description" content="Aprèn a fer servir TaxiCount pas a pas: crear el compte, curses, jornada, agenda, cotxes, conductors i informes.">
<meta property="og:title" content="TaxiCount · Tutorials">
<meta property="og:description" content="Aprèn a fer servir TaxiCount pas a pas, al mòbil i a l'ordinador.">
<meta property="og:image" content="https://www.taxicount.com/tutorials/og.jpg">
<meta name="theme-color" content="#FFC107">
<link rel="icon" href="../assets/brand/isotip.png">
<!-- Tutorials pas a pas amb captures reals de l'app (demo local) i rectangles de la posició
     REAL de cada botó. Dades a data.js (generat per registro/presentacion/generador/build_tut.py).
     ?t=<slug|número> obre un tutorial · ?p=pc|mobil força la versió · ?lang=ca|es -->
<style>
  :root { --amber: #FFC107; --amber-dk: #7A5A0B; --ink: #1F1B16; --muted: #5F5A52; --side: #F3EFE8; --card: #FFF8F2; }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--side); color: var(--ink); font-family: Arial, Helvetica, sans-serif; }
  body { display: flex; justify-content: center; }
  .app { position: relative; width: min(100vw, 520px); height: 100dvh; background: #fff; display: flex; flex-direction: column; overflow: hidden; }
  body.pc .app { width: min(100vw, 1180px); }
  @media (min-width: 700px) { .app { margin: 16px 0; height: calc(100dvh - 32px); border-radius: 22px; box-shadow: 0 20px 60px rgba(31,27,22,.15); } }
  .bar { display: flex; align-items: center; gap: 8px; padding: max(12px, env(safe-area-inset-top)) 14px 8px; flex-wrap: wrap; }
  .bar img { height: 30px; }
  .grow { flex: 1; }
  .seg { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 16px; overflow: hidden; }
  .seg button { border: 0; background: #fff; color: var(--ink); font: 700 13px Arial; padding: 5px 10px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .x { border: 0; background: transparent; font-size: 26px; line-height: 1; padding: 4px 8px; cursor: pointer; color: var(--ink); }
  .menu { padding: 8px 18px 28px; flex: 1; overflow: auto; }
  .menu h1 { font-size: 30px; margin: 10px 0 6px; }
  .menu p.lead { color: var(--muted); font-size: 16px; line-height: 1.4; margin-bottom: 14px; }
  .menu h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--amber-dk); margin: 18px 0 8px; }
  .grid { display: grid; gap: 10px; }
  body.pc .grid { grid-template-columns: repeat(3, 1fr); }
  .tcard { display: flex; gap: 14px; align-items: center; width: 100%; text-align: left; border: 0; border-radius: 18px; padding: 16px; cursor: pointer; background: var(--card); box-shadow: 0 2px 10px rgba(31,27,22,.06); }
  .tcard .n { flex: none; width: 44px; height: 44px; border-radius: 50%; background: var(--amber); font: 700 19px Arial; display: flex; align-items: center; justify-content: center; }
  .tcard b { display: block; font-size: 18px; margin-bottom: 4px; color: var(--ink); }
  .tcard span { color: var(--muted); font-size: 14px; line-height: 1.35; }
  .viewer { display: none; flex: 1; flex-direction: column; min-height: 0; }
  .prog { display: flex; gap: 4px; padding: 0 14px 6px; }
  .prog i { flex: 1; height: 4px; border-radius: 2px; background: rgba(31,27,22,.15); }
  .prog i.on { background: var(--ink); }
  .head { padding: 6px 18px 4px; }
  .step-n { font: 700 13px Arial; color: var(--amber-dk); text-transform: uppercase; letter-spacing: .5px; }
  .head h2 { font-size: 22px; line-height: 1.15; margin: 3px 0 4px; }
  .head p { font-size: 15.5px; line-height: 1.38; color: var(--muted); }
  body.pc .head h2 { font-size: 26px; } body.pc .head p { font-size: 17px; }
  .stage { position: relative; flex: 1; display: flex; padding: 8px 14px 4px; min-height: 240px; }
  .dev { position: relative; flex: 1; background: #16130f; border-radius: 30px; padding: 7px; box-shadow: 0 16px 40px rgba(31,27,22,.22); cursor: zoom-in; }
  body.pc .dev { border-radius: 16px; padding: 10px; }
  .dev.doc { background: #e7e3dc; border-radius: 12px; padding: 0; box-shadow: none; }
  .screen { position: absolute; inset: 7px; border-radius: 24px; overflow: hidden; background: var(--card); }
  body.pc .screen { inset: 10px; border-radius: 6px; }
  .dev.doc .screen { inset: 0; border-radius: 12px; background: #e7e3dc; }
  .canvas { position: absolute; left: 0; top: 0; width: 100%; transition: transform .35s ease; }
  .canvas img { width: 100%; height: auto; display: block; }
  .ring { position: absolute; border: 3px solid var(--amber); border-radius: 12px; box-shadow: 0 0 0 4px rgba(255,193,7,.35); animation: pulse 1.6s ease-in-out infinite; pointer-events: none; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 10px rgba(255,193,7,.15); } }
  .zoomhint { position: absolute; right: 14px; bottom: 14px; background: rgba(31,27,22,.75); color: #fff; font: 700 12px Arial; border-radius: 12px; padding: 5px 9px; pointer-events: none; }
  .info { flex: 1; padding: 6px 18px 10px; overflow: auto; }
  body.pc .info { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; align-content: start; }
  .info[hidden] { display: none !important; }
  .opt { border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; color: #fff; }
  .opt b { display: block; font-size: 17px; margin-bottom: 4px; }
  .opt span { font-size: 14.5px; line-height: 1.4; opacity: .95; }
  .note { font-size: 14.5px; line-height: 1.4; color: var(--muted); background: var(--card); border-radius: 12px; padding: 12px 14px; }
  body.pc .note { grid-column: 1 / -1; }
  .nav { display: flex; gap: 10px; padding: 8px 14px max(12px, env(safe-area-inset-bottom)); }
  body.pc .nav { max-width: 520px; width: 100%; margin: 0 auto; }
  .nav button { flex: 1; height: 48px; border-radius: 26px; font: 700 17px Arial; cursor: pointer; }
  .prev { background: #fff; border: 2px solid #DDD6CB; color: var(--ink); }
  .next { background: var(--ink); border: 0; color: #fff; }
  .nav button:disabled { opacity: .35; cursor: default; }
  .full { position: fixed; inset: 0; z-index: 20; background: rgba(20,17,13,.92); display: none; overflow: auto; }
  .full .wrap { position: relative; width: min(100vw, 520px); margin: 0 auto; padding: 56px 12px 24px; }
  body.pc .full .wrap { width: min(100vw, 1400px); }
  .full .canvas { position: relative; transition: none; border-radius: 12px; overflow: hidden; }
  .full .x { position: fixed; top: 10px; right: 10px; color: #fff; font-size: 30px; z-index: 21; }
  button:focus-visible, .dev:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .ring { animation: none; } .canvas { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <button class="x" id="close" hidden>&#8592;</button>
    <img src="marca.png" alt="TaxiCount" id="logo">
    <div class="grow"></div>
    <div class="seg"><button data-p="phone"></button><button data-p="pc"></button></div>
    <div class="seg"><button data-l="ca">CA</button><button data-l="es">ES</button></div>
  </div>
  <section class="menu" id="menu"></section>
  <section class="viewer" id="viewer">
    <div class="prog" id="prog"></div>
    <div class="head"><div class="step-n" id="stepn"></div><h2 id="title"></h2><p id="text"></p></div>
    <div class="stage" id="stage"><div class="dev" id="dev" role="button" tabindex="0"><div class="screen" id="screen"><div class="canvas" id="canvas"><img id="shot" alt=""><div class="ring" id="ring"></div></div></div><span class="zoomhint" id="zoomhint"></span></div></div>
    <div class="info" id="info" hidden></div>
    <div class="nav"><button class="prev" id="prev"></button><button class="next" id="next"></button></div>
  </section>
</div>
<div class="full" id="full"><button class="x" id="fullx" aria-label="X">&#215;</button><div class="wrap"><div class="canvas" id="fullc"><img id="fullimg" alt=""><div class="ring" id="fullring"></div></div></div></div>
<script src="data.js"></script>
<script>
(() => {
  const D = window.TUT, $ = (id) => document.getElementById(id);
  const qs = new URLSearchParams(location.search);
  let lang = 'ca', plat = 'phone';
  try { lang = qs.get('lang') || localStorage.getItem('tc_lang') || ((navigator.language || '').toLowerCase().startsWith('es') ? 'es' : 'ca'); } catch (e) {}
  if (lang !== 'es') lang = 'ca';
  // Ordinador si la pantalla és gran i amb ratolí; es pot forçar amb ?p=pc|mobil o amb el botó.
  const q = qs.get('p');
  plat = q === 'pc' ? 'pc' : (q === 'mobil' || q === 'movil' || q === 'phone') ? 'phone'
    : (window.innerWidth >= 900 && matchMedia('(pointer: fine)').matches ? 'pc' : 'phone');
  const tutOrder = D.tuts.map((t, i) => i).sort((a, b) => D.tuts[a].group - D.tuts[b].group || a - b);
  let tut = -1, step = 0;
  const steps = () => D.tuts[tut].steps.filter((s) => s.info || (s.img && s.img[plat]));
  const cur = () => steps()[step];

  function renderMenu() {
    const u = D.ui[lang];
    let h = `<h1>${u.title}</h1><p class="lead">${u.lead}</p>`, n = 0;
    [0, 1, 2].forEach((g) => {
      const items = tutOrder.filter((i) => D.tuts[i].group === g);
      h += `<h3>${u.groups[g]}</h3><div class="grid">` + items.map((i) => { n++; const t = D.tuts[i]; return `<button class="tcard" data-t="${i}"><span class="n">${n}</span><span><b>${t.name[lang]}</b><span>${t.sub[lang]}</span></span></button>`; }).join('') + '</div>';
    });
    $('menu').innerHTML = h;
    $('menu').querySelectorAll('.tcard').forEach((b) => b.addEventListener('click', () => open(+b.dataset.t)));
  }
  function open(i) { tut = i; step = 0; $('menu').style.display = 'none'; $('viewer').style.display = 'flex'; $('close').hidden = false; $('logo').style.display = 'none'; render(); }
  function close() { tut = -1; $('menu').style.display = 'block'; $('viewer').style.display = 'none'; $('close').hidden = true; $('logo').style.display = ''; renderMenu(); }
  function ringOf(s) { return s.ring && s.ring[plat] && s.ring[plat][lang]; }
  function dimOf(s) { return s.doc ? null : D.dim[plat]; }
  function placeRing(el, r, dim) {
    if (!r || !dim) { el.style.display = 'none'; return; }
    // Marge de 4 px al voltant, però sense sortir de la captura (elements d'amplada completa).
    const pad = 4; el.style.display = 'block';
    const x0 = Math.max(2, r[0] - pad), y0 = Math.max(2, r[1] - pad);
    const x1 = Math.min(dim[0] - 2, r[0] + r[2] + pad), y1 = Math.min(dim[1] - 2, r[1] + r[3] + pad);
    el.style.left = (x0 / dim[0] * 100) + '%'; el.style.top = (y0 / dim[1] * 100) + '%';
    el.style.width = ((x1 - x0) / dim[0] * 100) + '%'; el.style.height = ((y1 - y0) / dim[1] * 100) + '%';
  }
  function render() {
    const u = D.ui[lang], t = D.tuts[tut], ss = steps(), s = ss[step], n = ss.length;
    $('prog').innerHTML = ss.map((_, k) => `<i class="${k <= step ? 'on' : ''}"></i>`).join('');
    $('stepn').textContent = `${t.name[lang]} · ${u.step.replace('{n}', step + 1).replace('{t}', n)}`;
    $('title').textContent = s.t[lang];
    $('text').textContent = s.x ? s.x[lang] : '';
    if (s.info) {
      $('stage').style.display = 'none'; $('info').hidden = false;
      $('info').innerHTML = s.opts[lang].map(([c, h, p]) => `<div class="opt" style="background:${c}"><b>${h}</b><span>${p}</span></div>`).join('') + `<div class="note">${s.note[lang]}</div>`;
    } else {
      $('info').hidden = true; $('stage').style.display = 'flex';
      $('dev').classList.toggle('doc', !!s.doc);
      $('shot').onload = focus;
      $('shot').src = s.img[plat][lang]; $('shot').alt = s.t[lang];
      placeRing($('ring'), ringOf(s), dimOf(s));
      $('zoomhint').textContent = u.zoom;
      if ($('shot').complete) focus();
    }
    $('prev').textContent = u.prev; $('prev').disabled = step === 0;
    $('next').textContent = step === n - 1 ? u.done : u.next;
    const nx = ss[step + 1]; if (nx && nx.img && nx.img[plat]) { const im = new Image(); im.src = nx.img[plat][lang]; }
  }
  // La imatge omple l'amplada; si és més alta que l'espai, es desplaça fins al rectangle.
  // A l'ordinador (i els documents) es veu sencera, ajustada a l'espai.
  function focus() {
    if (tut < 0) return; const s = cur(); if (!s || s.info) return;
    const img = $('shot'), W = $('screen').clientWidth, Hc = $('screen').clientHeight;
    const ratio = img.naturalWidth ? img.naturalHeight / img.naturalWidth : D.dim[plat][1] / D.dim[plat][0];
    let w = W, H = W * ratio;
    if ((s.doc || plat === 'pc') && H > Hc) { H = Hc; w = Hc / ratio; }
    $('canvas').style.width = w + 'px'; $('canvas').style.left = ((W - w) / 2) + 'px';
    const r = ringOf(s), dim = dimOf(s);
    const y = r && dim ? (r[1] + r[3] / 2) / dim[1] * H : 0;
    const off = H <= Hc ? -(Hc - H) / 2 : Math.max(0, Math.min(H - Hc, y - Hc / 2));
    $('canvas').style.transform = `translateY(${-off}px)`;
  }
  function openFull() {
    const s = cur(); if (!s || s.info) return;
    $('fullimg').src = s.img[plat][lang]; $('fullimg').alt = s.t[lang];
    placeRing($('fullring'), ringOf(s), dimOf(s));
    $('full').style.display = 'block'; $('full').scrollTop = 0;
  }
  function go(dlt) { const n = steps().length; if (step + dlt >= n) return close(); step = Math.max(0, step + dlt); render(); }
  function setLang(l) {
    lang = l; try { localStorage.setItem('tc_lang', l); } catch (e) {}
    document.documentElement.lang = l;
    document.querySelectorAll('[data-l]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.l === l)));
    document.querySelectorAll('[data-p]').forEach((b) => { b.textContent = D.ui[l][b.dataset.p]; });
    $('close').setAttribute('aria-label', D.ui[l].menu);
    if (tut < 0) renderMenu(); else render();
  }
  function setPlat(p) {
    plat = p; document.body.classList.toggle('pc', p === 'pc');
    document.querySelectorAll('[data-p]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.p === p)));
    if (tut < 0) renderMenu(); else { step = Math.min(step, steps().length - 1); render(); }
  }
  $('next').addEventListener('click', () => go(1));
  $('prev').addEventListener('click', () => go(-1));
  $('close').addEventListener('click', close);
  $('dev').addEventListener('click', openFull);
  $('dev').addEventListener('keydown', (e) => { if (e.key === 'Enter') openFull(); });
  $('fullx').addEventListener('click', () => { $('full').style.display = 'none'; });
  $('full').addEventListener('click', (e) => { if (e.target === $('full')) $('full').style.display = 'none'; });
  document.querySelectorAll('[data-l]').forEach((b) => b.addEventListener('click', () => setLang(b.dataset.l)));
  document.querySelectorAll('[data-p]').forEach((b) => b.addEventListener('click', () => setPlat(b.dataset.p)));
  window.addEventListener('resize', focus);
  document.addEventListener('keydown', (e) => {
    if ($('full').style.display === 'block') { if (e.key === 'Escape') $('full').style.display = 'none'; return; }
    if (tut < 0) return;
    if (e.key === 'ArrowRight') go(1); if (e.key === 'ArrowLeft') go(-1); if (e.key === 'Escape') close();
  });
  let x0 = null;
  $('viewer').addEventListener('pointerdown', (e) => { x0 = e.clientX; });
  $('viewer').addEventListener('pointerup', (e) => { if (x0 == null) return; const dx = e.clientX - x0; x0 = null; if (Math.abs(dx) > 60) go(dx < 0 ? 1 : -1); });
  setPlat(plat); setLang(lang);
  // ?t=slug o número (1 = primer del menú)
  const tq = qs.get('t');
  if (tq) { const bySlug = D.tuts.findIndex((t) => t.slug === tq); const byNum = tutOrder[(+tq || 0) - 1]; const i = bySlug >= 0 ? bySlug : byNum; if (i != null && i >= 0) open(i); }
})();
</script>
</body>
</html>
